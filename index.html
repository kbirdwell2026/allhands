<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All Hands Q&A</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #F7F5F0;
    --surface: #FFFFFF;
    --border: #E8E4DC;
    --text: #1A1814;
    --muted: #8A8680;
    --accent: #1A1814;
    --accent-light: #F0EDE6;
    --green: #2D6A4F;
    --green-light: #E8F5EE;
    --pin: #B5451B;
    --pin-light: #FDF0EB;
    --answered: #6B7280;
    --radius: 12px;
    --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 4px 16px rgba(0,0,0,0.04);
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 15px;
    line-height: 1.6;
  }

  /* Header */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 20px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .header-left h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 22px;
    font-weight: 400;
    letter-spacing: -0.3px;
  }

  .header-left p {
    font-size: 13px;
    color: var(--muted);
    margin-top: 1px;
  }

  .live-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 500;
    color: var(--green);
    background: var(--green-light);
    padding: 5px 10px;
    border-radius: 20px;
  }

  .live-dot {
    width: 6px;
    height: 6px;
    background: var(--green);
    border-radius: 50%;
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* Layout */
  main {
    max-width: 680px;
    margin: 0 auto;
    padding: 28px 20px 60px;
  }

  /* Submit form */
  .submit-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 32px;
    box-shadow: var(--shadow);
  }

  .submit-card h2 {
    font-size: 15px;
    font-weight: 500;
    margin-bottom: 14px;
  }

  textarea {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    color: var(--text);
    background: var(--bg);
    resize: vertical;
    min-height: 96px;
    outline: none;
    transition: border-color 0.15s;
    line-height: 1.5;
  }

  textarea:focus { border-color: var(--accent); background: var(--surface); }
  textarea::placeholder { color: var(--muted); }

  .format-row {
    display: flex;
    gap: 10px;
    margin-top: 12px;
    flex-wrap: wrap;
  }

  .format-option {
    flex: 1;
    min-width: 120px;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    cursor: pointer;
    transition: all 0.15s;
    background: var(--bg);
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }

  .format-option:hover { border-color: #C8C4BC; }

  .format-option.selected {
    border-color: var(--accent);
    background: var(--surface);
  }

  .format-option input[type="radio"] { display: none; }

  .format-icon {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    flex-shrink: 0;
    margin-top: 1px;
  }

  .format-icon.anon { background: #EEE; color: var(--muted); }
  .format-icon.open { background: var(--accent-light); color: var(--accent); }

  .format-label strong { display: block; font-size: 13px; font-weight: 500; }
  .format-label span { font-size: 12px; color: var(--muted); }

  .name-field {
    margin-top: 12px;
    display: none;
  }

  .name-field.visible { display: block; }

  .name-field input {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    background: var(--bg);
    outline: none;
    transition: border-color 0.15s;
  }

  .name-field input:focus { border-color: var(--accent); background: var(--surface); }
  .name-field input::placeholder { color: var(--muted); }

  .notice {
    margin-top: 12px;
    font-size: 12px;
    color: var(--muted);
    display: flex;
    gap: 6px;
    align-items: flex-start;
    line-height: 1.4;
  }

  .notice::before { content: 'ⓘ'; font-size: 13px; flex-shrink: 0; }

  .submit-btn {
    width: 100%;
    margin-top: 14px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 12px;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
  }

  .submit-btn:hover { opacity: 0.88; }
  .submit-btn:active { transform: scale(0.99); }
  .submit-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* Success state */
  .success-msg {
    display: none;
    text-align: center;
    padding: 20px 0 4px;
  }

  .success-msg.visible { display: block; }

  .success-icon {
    width: 40px;
    height: 40px;
    background: var(--green-light);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 10px;
    font-size: 18px;
  }

  .success-msg p { font-size: 14px; color: var(--muted); }
  .success-msg strong { display: block; font-size: 15px; font-weight: 500; color: var(--text); margin-bottom: 4px; }

  .ask-another {
    margin-top: 14px;
    background: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 18px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    cursor: pointer;
    color: var(--text);
    transition: background 0.15s;
  }

  .ask-another:hover { background: var(--bg); }

  /* Questions list */
  .questions-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .questions-header h2 {
    font-size: 15px;
    font-weight: 500;
  }

  .q-count {
    font-size: 13px;
    color: var(--muted);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 3px 10px;
  }

  .empty-state {
    text-align: center;
    padding: 48px 24px;
    color: var(--muted);
  }

  .empty-state p { font-size: 14px; }

  /* Question card */
  .question-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
    margin-bottom: 10px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.15s;
    animation: fadeIn 0.3s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .question-card.pinned {
    border-color: var(--pin);
    border-left: 3px solid var(--pin);
  }

  .question-card.answered { opacity: 0.65; }

  .card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 10px;
  }

  .badges { display: flex; gap: 6px; flex-wrap: wrap; }

  .badge {
    font-size: 11px;
    font-weight: 500;
    padding: 3px 8px;
    border-radius: 20px;
    letter-spacing: 0.2px;
  }

  .badge-pin { background: var(--pin-light); color: var(--pin); }
  .badge-answered { background: #F3F4F6; color: var(--answered); }

  .question-text {
    font-size: 15px;
    line-height: 1.55;
    color: var(--text);
    margin-bottom: 12px;
  }

  .card-bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .author {
    font-size: 12px;
    color: var(--muted);
  }

  .upvote-btn {
    display: flex;
    align-items: center;
    gap: 5px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 5px 12px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    color: var(--text);
    transition: all 0.15s;
  }

  .upvote-btn:hover { border-color: #C8C4BC; background: var(--surface); }

  .upvote-btn.voted {
    background: var(--accent-light);
    border-color: var(--accent);
    color: var(--accent);
  }

  .upvote-btn svg { width: 13px; height: 13px; }

  /* Loading skeleton */
  .skeleton {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
    margin-bottom: 10px;
  }

  .skel-line {
    height: 13px;
    background: linear-gradient(90deg, var(--border) 25%, #f0ece4 50%, var(--border) 75%);
    background-size: 200% 100%;
    border-radius: 6px;
    animation: shimmer 1.4s ease infinite;
    margin-bottom: 8px;
  }

  .skel-line:last-child { width: 60%; margin-bottom: 0; }

  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <h1>All Hands Q&amp;A</h1>
    <p id="meeting-name">Loading session...</p>
  </div>
  <div class="live-badge">
    <div class="live-dot"></div>
    Live
  </div>
</header>

<main>

  <!-- Submit form -->
  <div class="submit-card" id="submit-card">
    <h2>Ask a question</h2>

    <textarea id="question-input" placeholder="What's on your mind?" maxlength="500"></textarea>

    <div class="format-row">
      <label class="format-option selected" id="opt-anon">
        <input type="radio" name="format" value="anon" checked onchange="onFormatChange()">
        <div class="format-icon anon">👤</div>
        <div class="format-label">
          <strong>Anonymous</strong>
          <span>Name won't be shared</span>
        </div>
      </label>
      <label class="format-option" id="opt-open">
        <input type="radio" name="format" value="open" onchange="onFormatChange()">
        <div class="format-icon open">✦</div>
        <div class="format-label">
          <strong>With my name</strong>
          <span>Name may be shown</span>
        </div>
      </label>
    </div>

    <div class="name-field" id="name-field">
      <input type="text" id="name-input" placeholder="Your name" maxlength="60">
    </div>

    <p class="notice">The admin decides whether your name is shown publicly, regardless of your choice here.</p>

    <button class="submit-btn" id="submit-btn" onclick="submitQuestion()">Send question</button>

    <div class="success-msg" id="success-msg">
      <div class="success-icon">✓</div>
      <strong>Question submitted!</strong>
      <p>It will appear here once approved by the moderator.</p>
      <button class="ask-another" onclick="resetForm()">Ask another question</button>
    </div>
  </div>

  <!-- Questions list -->
  <div class="questions-header">
    <h2>Approved questions</h2>
    <span class="q-count" id="q-count">—</span>
  </div>

  <div id="questions-list">
    <div class="skeleton"><div class="skel-line"></div><div class="skel-line"></div><div class="skel-line" style="width:60%"></div></div>
    <div class="skeleton"><div class="skel-line"></div><div class="skel-line" style="width:80%"></div></div>
  </div>

</main>

<script>
  const API = 'https://script.google.com/a/macros/taxdome.com/s/AKfycbxpuJI31QwdHhrf39vgAnRcm8PwBdOhPGmMS4r25MKOxL99FjJ2-4Nh-BC5_QFqI-O3/exec'; // ← замени на свой URL
  const POLL_INTERVAL = 10000;
  const voted = new Set(JSON.parse(localStorage.getItem('voted') || '[]'));
  let questions = [];

  // Format toggle
  function onFormatChange() {
    const val = document.querySelector('input[name="format"]:checked').value;
    document.getElementById('opt-anon').classList.toggle('selected', val === 'anon');
    document.getElementById('opt-open').classList.toggle('selected', val === 'open');
    document.getElementById('name-field').classList.toggle('visible', val === 'open');
  }

async function submitQuestion() {
    const text = document.getElementById('question-input').value.trim();
    if (!text) return;

    const format = document.querySelector('input[name="format"]:checked').value;
    const name = document.getElementById('name-input').value.trim();

    if (format === 'open' && !name) {
      document.getElementById('name-input').focus();
      return;
    }

    const btn = document.getElementById('submit-btn');
    btn.disabled = true;
    btn.textContent = 'Sending...';

    try {
      const params = new URLSearchParams({
        action: 'submitQuestion',
        text: text,
        submittedAs: format,
        name: format === 'open' ? name : ''
      });

      await fetch(API + '?' + params.toString(), { method: 'GET' });

      document.getElementById('question-input').style.display = 'none';
      document.querySelector('.format-row').style.display = 'none';
      document.getElementById('name-field').style.display = 'none';
      document.querySelector('.notice').style.display = 'none';
      btn.style.display = 'none';
      document.getElementById('success-msg').classList.add('visible');
    } catch(e) {
      btn.disabled = false;
      btn.textContent = 'Send question';
      alert('Error: ' + e.toString());
    }
  }

  // Reset form
  function resetForm() {
    document.getElementById('question-input').style.display = '';
    document.getElementById('question-input').value = '';
    document.querySelector('.format-row').style.display = '';
    document.getElementById('name-field').style.display = '';
    document.querySelector('.notice').style.display = '';
    document.getElementById('submit-btn').style.display = '';
    document.getElementById('submit-btn').disabled = false;
    document.getElementById('submit-btn').textContent = 'Send question';
    document.getElementById('success-msg').classList.remove('visible');
    document.querySelector('input[value="anon"]').checked = true;
    onFormatChange();
  }

  // Upvote
  async function upvote(id, rowIndex) {
    if (voted.has(id)) return;
    voted.add(id);
    localStorage.setItem('voted', JSON.stringify([...voted]));

    const btn = document.getElementById('upvote-' + id);
    if (btn) {
      btn.classList.add('voted');
      const count = btn.querySelector('.upvote-count');
      count.textContent = parseInt(count.textContent) + 1;
    }

    try {
      await fetch(API, {
        method: 'POST',
        body: JSON.stringify({ action: 'upvote', rowIndex })
      });
    } catch(e) {}
  }

  // Render questions
  function render(qs) {
    const list = document.getElementById('questions-list');
    document.getElementById('q-count').textContent = qs.length + ' question' + (qs.length !== 1 ? 's' : '');

    if (qs.length === 0) {
      list.innerHTML = '<div class="empty-state"><p>No approved questions yet.<br>Be the first to ask!</p></div>';
      return;
    }

    list.innerHTML = qs.map(q => `
      <div class="question-card ${q.pinned ? 'pinned' : ''} ${q.answered ? 'answered' : ''}">
        <div class="card-top">
          <div class="badges">
            ${q.pinned ? '<span class="badge badge-pin">📌 Pinned</span>' : ''}
            ${q.answered ? '<span class="badge badge-answered">Answered</span>' : ''}
          </div>
        </div>
        <p class="question-text">${escHtml(q.text)}</p>
        <div class="card-bottom">
          <span class="author">${q.name ? escHtml(q.name) : 'Anonymous'}</span>
          <button class="upvote-btn ${voted.has(q.id) ? 'voted' : ''}"
            id="upvote-${q.id}"
            onclick="upvote('${q.id}', ${q.rowIndex})">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M8 3L8 13M3 8L8 3L13 8"/>
            </svg>
            <span class="upvote-count">${q.likes || 0}</span>
          </button>
        </div>
      </div>
    `).join('');
  }

  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // Fetch questions
  async function fetchQuestions() {
    try {
      const res = await fetch(API + '?action=getApproved');
      const data = await res.json();
      questions = data;
      render(data);
    } catch(e) {}
  }

  // Fetch meeting name from Settings
  async function fetchSettings() {
    try {
      const res = await fetch(API + '?action=getSettings');
      const data = await res.json();
      if (data.meetingName) {
        document.getElementById('meeting-name').textContent = data.meetingName;
      }
    } catch(e) {
      document.getElementById('meeting-name').textContent = 'Q&A Session';
    }
  }

  // Init
  fetchSettings();
  fetchQuestions();
  setInterval(fetchQuestions, POLL_INTERVAL);
</script>

</body>
</html>
