<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaxDome All Hands Q&A</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #F4F6FB;
    --surface: #FFFFFF;
    --border: #E4EAF5;
    --text: #0F1C3F;
    --muted: #7A8BAD;
    --accent: #1A3ACC;
    --accent-light: #D9E6FF;
    --accent-mid: #8EB8FF;
    --radius: 12px;
    --shadow: 0 1px 3px rgba(40,81,245,0.06), 0 4px 16px rgba(40,81,245,0.04);
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 15px;
    line-height: 1.6;
  }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .header-divider {
    width: 1px;
    height: 22px;
    background: var(--border);
  }

  .header-title {
    font-size: 15px;
    font-weight: 500;
    color: var(--text);
  }

  .header-subtitle {
    font-size: 12px;
    color: var(--muted);
    margin-top: 1px;
  }

  .live-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 500;
    color: var(--accent);
    background: var(--accent-light);
    padding: 5px 10px;
    border-radius: 20px;
  }

  .live-dot {
    width: 6px;
    height: 6px;
    background: var(--accent);
    border-radius: 50%;
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  main {
    max-width: 680px;
    margin: 0 auto;
    padding: 28px 20px 60px;
  }

  .submit-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 32px;
    box-shadow: var(--shadow);
  }

  .submit-card h2 {
    font-size: 15px;
    font-weight: 500;
    margin-bottom: 14px;
  }

  textarea {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    color: var(--text);
    background: var(--bg);
    resize: vertical;
    min-height: 96px;
    outline: none;
    transition: border-color 0.15s;
    line-height: 1.5;
  }

  textarea:focus { border-color: var(--accent); background: var(--surface); }
  textarea::placeholder { color: var(--muted); }

  .format-row {
    display: flex;
    gap: 10px;
    margin-top: 12px;
    flex-wrap: wrap;
  }

  .format-option {
    flex: 1;
    min-width: 120px;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    cursor: pointer;
    transition: all 0.15s;
    background: var(--bg);
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }

  .format-option:hover { border-color: var(--accent-mid); }

  .format-option.selected {
    border-color: var(--accent);
    background: var(--surface);
    box-shadow: 0 0 0 3px rgba(26,58,204,0.07);
  }

  .format-option input[type="radio"] { display: none; }

  .format-icon {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    flex-shrink: 0;
    margin-top: 1px;
  }

  .format-icon.open { background: var(--accent-light); color: var(--accent); }
  .format-icon.anon { background: #EEF0F5; color: var(--muted); }

  .format-label strong { display: block; font-size: 13px; font-weight: 500; }
  .format-label span { font-size: 12px; color: var(--muted); }

  .name-field { margin-top: 12px; display: none; }
  .name-field.visible { display: block; }

  .name-field input {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    background: var(--bg);
    outline: none;
    transition: border-color 0.15s;
    color: var(--text);
  }

  .name-field input:focus { border-color: var(--accent); background: var(--surface); }
  .name-field input::placeholder { color: var(--muted); }

  .notice {
    margin-top: 12px;
    font-size: 12px;
    color: #3A5AAE;
    display: flex;
    gap: 8px;
    align-items: flex-start;
    line-height: 1.5;
    background: var(--accent-light);
    border-radius: 8px;
    padding: 10px 12px;
  }

  .notice-icon { font-size: 14px; flex-shrink: 0; margin-top: 1px; }

  .submit-btn {
    width: 100%;
    margin-top: 14px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 12px;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s, box-shadow 0.15s;
    box-shadow: 0 2px 8px rgba(26,58,204,0.28);
    letter-spacing: 0.1px;
  }

  .submit-btn:hover { opacity: 0.92; box-shadow: 0 4px 14px rgba(26,58,204,0.35); }
  .submit-btn:active { transform: scale(0.99); }
  .submit-btn:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }

  .success-msg { display: none; text-align: center; padding: 20px 0 4px; }
  .success-msg.visible { display: block; }

  .success-icon {
    width: 40px;
    height: 40px;
    background: var(--accent-light);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 10px;
    font-size: 18px;
    color: var(--accent);
  }

  .success-msg p { font-size: 14px; color: var(--muted); }
  .success-msg strong { display: block; font-size: 15px; font-weight: 500; color: var(--text); margin-bottom: 4px; }

  .ask-another {
    margin-top: 14px;
    background: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 18px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    cursor: pointer;
    color: var(--text);
    transition: background 0.15s;
  }

  .ask-another:hover { background: var(--bg); }

  .questions-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .questions-header h2 { font-size: 15px; font-weight: 500; }

  .q-count {
    font-size: 13px;
    color: var(--accent);
    background: var(--accent-light);
    border-radius: 20px;
    padding: 3px 10px;
    font-weight: 500;
  }

  .empty-state { text-align: center; padding: 48px 24px; color: var(--muted); }
  .empty-state p { font-size: 14px; }

  .question-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
    margin-bottom: 10px;
    box-shadow: var(--shadow);
    animation: fadeIn 0.3s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .question-card.pinned { border-left: 3px solid var(--accent); }
  .question-card.answered { opacity: 0.65; }

  .card-top { margin-bottom: 8px; }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; }

  .badge { font-size: 11px; font-weight: 500; padding: 3px 8px; border-radius: 20px; }
  .badge-pin { background: var(--accent-light); color: var(--accent); }
  .badge-answered { background: #F3F4F6; color: #6B7280; }

  .question-text { font-size: 15px; line-height: 1.55; color: var(--text); margin-bottom: 12px; }

  .card-bottom { display: flex; align-items: center; justify-content: space-between; }
  .author { font-size: 12px; color: var(--muted); }

  .upvote-btn {
    display: flex;
    align-items: center;
    gap: 5px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 5px 12px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    color: var(--text);
    transition: all 0.15s;
  }

  .upvote-btn:hover { border-color: var(--accent-mid); }
  .upvote-btn.voted { background: var(--accent-light); border-color: var(--accent); color: var(--accent); }
  .upvote-btn svg { width: 13px; height: 13px; }

  .skeleton { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 10px; }
  .skel-line {
    height: 13px;
    background: linear-gradient(90deg, var(--border) 25%, #eef2fc 50%, var(--border) 75%);
    background-size: 200% 100%;
    border-radius: 6px;
    animation: shimmer 1.4s ease infinite;
    margin-bottom: 8px;
  }

  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <img src="logo.png" height="28" alt="TaxDome" style="display:block;">
    <div class="header-divider"></div>
    <div>
      <div class="header-title">All Hands Q&amp;A</div>
      <div class="header-subtitle" id="meeting-name">Loading...</div>
    </div>
  </div>
  <div class="live-badge">
    <div class="live-dot"></div>
    Live
  </div>
</header>

<main>

  <div class="submit-card">
    <h2>Ask a question</h2>

    <textarea id="question-input" placeholder="What's on your mind?" maxlength="500"></textarea>

    <div class="format-row">
      <label class="format-option selected" id="opt-open">
        <input type="radio" name="format" value="open" checked onchange="onFormatChange()">
        <div class="format-icon open">✦</div>
        <div class="format-label">
          <strong>With my name</strong>
          <span>Name may be shown</span>
        </div>
      </label>
      <label class="format-option" id="opt-anon">
        <input type="radio" name="format" value="anon" onchange="onFormatChange()">
        <div class="format-icon anon">👤</div>
        <div class="format-label">
          <strong>Anonymous</strong>
          <span>Name won't be shared</span>
        </div>
      </label>
    </div>

    <div class="name-field visible" id="name-field">
      <input type="text" id="name-input" placeholder="Your name" maxlength="60">
    </div>

    <div class="notice">
      <span class="notice-icon">💙</span>
      <span>We support a culture of openness at TaxDome and encourage everyone to use the opportunity to ask questions openly and non-anonymously.</span>
    </div>

    <button class="submit-btn" id="submit-btn" onclick="submitQuestion()">Send question</button>

    <div class="success-msg" id="success-msg">
      <div class="success-icon">✓</div>
      <strong>Question submitted!</strong>
      <p>It will appear here once approved by the moderator.</p>
      <button class="ask-another" onclick="resetForm()">Ask another question</button>
    </div>
  </div>

  <div class="questions-header">
    <h2>Questions</h2>
    <span class="q-count" id="q-count">—</span>
  </div>

  <div id="questions-list">
    <div class="skeleton"><div class="skel-line"></div><div class="skel-line"></div><div class="skel-line" style="width:60%"></div></div>
    <div class="skeleton"><div class="skel-line"></div><div class="skel-line" style="width:80%"></div></div>
  </div>

</main>

<script>
  const API = 'https://script.google.com/a/macros/taxdome.com/s/AKfycbwqaq5WZjQUKQIwE5wL2DT2iU6g2QEwYw47ojt-se1PgUtiK2lcT9euCxp-z5D--e_x/exec';
  const POLL_INTERVAL = 10000;
  const voted = new Set(JSON.parse(localStorage.getItem('voted') || '[]'));

  function onFormatChange() {
    const val = document.querySelector('input[name="format"]:checked').value;
    document.getElementById('opt-open').classList.toggle('selected', val === 'open');
    document.getElementById('opt-anon').classList.toggle('selected', val === 'anon');
    document.getElementById('name-field').classList.toggle('visible', val === 'open');
  }

  async function submitQuestion() {
    const text = document.getElementById('question-input').value.trim();
    if (!text) return;

    const format = document.querySelector('input[name="format"]:checked').value;
    const name = document.getElementById('name-input').value.trim();

    if (format === 'open' && !name) {
      document.getElementById('name-input').focus();
      return;
    }

    const btn = document.getElementById('submit-btn');
    btn.disabled = true;
    btn.textContent = 'Sending...';

    const params = new URLSearchParams({
      action: 'submitQuestion',
      text: text,
      submittedAs: format,
      name: format === 'open' ? name : ''
    });

    new Image().src = API + '?' + params.toString();

    setTimeout(() => {
      document.getElementById('question-input').style.display = 'none';
      document.querySelector('.format-row').style.display = 'none';
      document.getElementById('name-field').style.display = 'none';
      document.querySelector('.notice').style.display = 'none';
      btn.style.display = 'none';
      document.getElementById('success-msg').classList.add('visible');
    }, 1500);
  }

  function resetForm() {
    document.getElementById('question-input').style.display = '';
    document.getElementById('question-input').value = '';
    document.querySelector('.format-row').style.display = '';
    document.getElementById('name-field').classList.add('visible');
    document.querySelector('.notice').style.display = '';
    document.getElementById('submit-btn').style.display = '';
    document.getElementById('submit-btn').disabled = false;
    document.getElementById('submit-btn').textContent = 'Send question';
    document.getElementById('success-msg').classList.remove('visible');
    document.querySelector('input[value="open"]').checked = true;
    onFormatChange();
  }

  async function upvote(id, rowIndex) {
    if (voted.has(id)) return;
    voted.add(id);
    localStorage.setItem('voted', JSON.stringify([...voted]));

    const btn = document.getElementById('upvote-' + id);
    if (btn) {
      btn.classList.add('voted');
      const count = btn.querySelector('.upvote-count');
      count.textContent = parseInt(count.textContent) + 1;
    }

    new Image().src = API + '?action=upvote&rowIndex=' + rowIndex;
  }

  function render(qs) {
    const list = document.getElementById('questions-list');
    document.getElementById('q-count').textContent = qs.length + ' question' + (qs.length !== 1 ? 's' : '');

    if (qs.length === 0) {
      list.innerHTML = '<div class="empty-state"><p>No questions yet.<br>Be the first to ask!</p></div>';
      return;
    }

    list.innerHTML = qs.map(q => `
      <div class="question-card ${q.pinned ? 'pinned' : ''} ${q.answered ? 'answered' : ''}">
        <div class="card-top">
          <div class="badges">
            ${q.pinned ? '<span class="badge badge-pin">📌 Pinned</span>' : ''}
            ${q.answered ? '<span class="badge badge-answered">Answered</span>' : ''}
          </div>
        </div>
        <p class="question-text">${escHtml(q.text)}</p>
        <div class="card-bottom">
          <span class="author">${q.name ? escHtml(q.name) : 'Anonymous'}</span>
          <button class="upvote-btn ${voted.has(q.id) ? 'voted' : ''}"
            id="upvote-${q.id}"
            onclick="upvote('${q.id}', ${q.rowIndex})">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M8 3L8 13M3 8L8 3L13 8"/>
            </svg>
            <span class="upvote-count">${q.likes || 0}</span>
          </button>
        </div>
      </div>
    `).join('');
  }

  function escHtml(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

    function jsonp(url) {
    return new Promise((resolve, reject) => {
      const cb = 'cb_' + Date.now() + '_' + Math.random().toString(36).slice(2);
      window[cb] = function(data) { delete window[cb]; resolve(data); };
      const s = document.createElement('script');
      s.src = url + '&callback=' + cb;
      s.onerror = () => { delete window[cb]; reject(new Error('JSONP failed')); };
      document.head.appendChild(s);
    });
  }

  async function fetchQuestions() {
    try {
      const data = await jsonp(API + '?action=getApproved');
      render(data);
    } catch(e) {}
  }

  async function fetchSettings() {
    try {
      const data = await jsonp(API + '?action=getSettings');
      if (data.meetingName) document.getElementById('meeting-name').textContent = data.meetingName;
    } catch(e) {
      document.getElementById('meeting-name').textContent = 'Q&A Session';;
    }
  }

  fetchSettings();
  fetchQuestions();
  setInterval(fetchQuestions, POLL_INTERVAL);
</script>

</body>
</html>
